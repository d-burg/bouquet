name: tests (solver / comprehensive)

# The comprehensive suite: runs the live OpenFUSIONToolkit GS solver
# (reconstruction-free replay + systematics, ~13 min).
#
# INTERIM POLICY (until OFT publishes to PyPI): this is **manual / on-demand**
# only.  It is NOT wired to the merge queue and is NOT a required status check,
# so it never blocks a merge.  The comprehensive suite is instead a documented
# pre-merge step -- run `pytest -m solver` (locally or on a box with the OFT
# fork built) and note the result in the PR before merging.  See docs/CI.md.
#
# It needs OFT built from StuartBenjamin/OpenFUSIONToolkit branch LCFS_grid_pack
# (open OpenFUSIONToolkit PR #365; the swb path needs its internal bootstrap
# solve) + the scientific Python env.  When run on a self-hosted runner, set
# the repo variable OFT_PYTHONPATH to that build's python dir; otherwise the
# test falls back to a sibling OpenFUSIONToolkit/ checkout.
#
# FUTURE (once OFT is on PyPI with the Ip fixes merged upstream): switch
# `runs-on` to `ubuntu-latest`, add a `pip install OpenFUSIONToolkit` step, and
# re-enable the `merge_group:` trigger to make this an automated pre-merge gate.
on:
  workflow_dispatch:
  # merge_group:        # <- re-enable once a runner (or PyPI OFT) is available

concurrency:
  group: solver-${{ github.ref }}
  cancel-in-progress: false   # let an in-flight comprehensive run finish

jobs:
  solver:
    runs-on: [self-hosted, feynman]
    timeout-minutes: 60
    env:
      # Path to the LCFS_grid_pack OFT build's python on feynman (build_release/python).
      # The solver tests also fall back to a sibling OpenFUSIONToolkit checkout.
      OFT_PYTHONPATH: ${{ vars.OFT_PYTHONPATH }}
    steps:
      - uses: actions/checkout@v4

      # --- environment ------------------------------------------------------
      # feynman provides Python 3 + numpy/scipy/h5py/matplotlib + the built OFT
      # fork.  Adapt this step to the cluster (module load / conda activate) if
      # the runner is not already inside the right environment, e.g.:
      #   module load python   &&   conda activate bouquet
      - name: Environment info
        run: |
          python --version
          python -c "import numpy, scipy, h5py, matplotlib; print('sci deps OK')"
          echo "OFT_PYTHONPATH=${OFT_PYTHONPATH:-<unset; using sibling fallback>}"

      - name: Install bouquet (editable) + pytest
        run: pip install -e . pytest

      - name: Sanity — OFT importable
        run: python -c "import OpenFUSIONToolkit; print('OFT', getattr(OpenFUSIONToolkit,'__version__','?'))"

      - name: Run comprehensive solver suite
        run: pytest -m solver -v -s
